      }
      cross: {
        stage1_epochs: 30, stage2_epochs: 20, batch_size: 64, lr: 0.002
      }
    bcic_iii_4a:
      arch: {
        f1: 9, f2: 48, time_kernel_length: 50, pool_kernels: [ 50, 100, 150 ]
      }
